[package]
authors = ["rerun.io <opensource@rerun.io>"]
categories = ["gui"]
description = "Web pages as egui widgets"
edition.workspace = true
homepage = "https://github.com/rerun-io/egui_crates"
include = ["**/*.rs", "Cargo.toml", "README.md"]
keywords = ["webview", "egui", "gui", "browser"]
license.workspace = true
name = "egui_webview"
publish = false
readme = "README.md"
repository = "https://github.com/rerun-io/egui_crates"
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
# `cef/dox` skips the CEF download, which docs.rs can't do without network access.
features = ["cef", "cef/dox"]

[lib]


[features]
default = []

#! Each platform has one backend that is always built: an `<iframe>` on the web, a `WKWebView`
#! through [wry](https://github.com/tauri-apps/wry) on macOS, and CEF on other native platforms,
#! such as Linux and Windows. `WebViewInstance::new` uses it.
#!
#! The `cef` feature also builds CEF on macOS. `WebViewInstance::new` then uses it when the
#! `EGUI_WEBVIEW_BACKEND` environment variable is `cef` at run time, and
#! `WebViewInstance::new_cef` always uses it.
#!
#! The `WKWebView` backend needs eframe's wgpu renderer. CEF downloads about 1 GB at build time,
#! and on Windows and macOS requires CMake and Ninja.

## Also build the CEF (Chromium) backend on macOS, which renders pages off screen into egui
## textures. On other native platforms, CEF is always built.
cef = ["dep:cef", "dep:tempfile", "dep:winit"]

## Make Chromium's sandbox available to CEF's helper processes. On its own, it changes nothing:
## the app turns the sandbox on with `CefInitOptions::sandbox`.
cef-sandbox = ["cef", "cef/sandbox"]


[build-dependencies]
cfg_aliases.workspace = true

[dependencies]
document-features = { workspace = true, optional = true }
eframe = { workspace = true, default-features = false }
egui = { workspace = true, default-features = false }
log.workspace = true
profiling.workspace = true
url.workspace = true

[dev-dependencies]
eframe = { workspace = true, default-features = false, features = [
  "default_fonts", # Embed the default egui fonts.
  "glow",          # The default renderer on the web.
  "wgpu",          # The renderer natively.
  "wayland",       # Required for Linux and CI.
] }

# The examples start eframe on the web with these.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "FocusOptions",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "Node",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64.workspace = true
# Optional here, for the `cef` feature on macOS. Always on in the next table.
cef = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# Converts egui keys to the platform scancodes that CEF expects, which egui's key events don't
# carry.
winit = { workspace = true, optional = true }

# CEF is the only backend on the native platforms without a wry backend.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "macos")))'.dependencies]
cef.workspace = true
tempfile.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The objc2 crates must be the versions wry uses, so that the `WKWebView` wry returns has the
# same Rust type as ours.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-quartz-core",
  "NSAppearance",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSDictionary",
  "NSKeyValueObserving",
  "NSString",
  "NSURL",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CALayer",
  "CAMetalLayer",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "WKFrameInfo",
  "WKScriptMessage",
  "WKScriptMessageHandler",
  "WKUserContentController",
] }
raw-window-handle = "0.6.2"
wry = { version = "0.57.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux, winit's scancode conversion (`PhysicalKeyExtScancode`) needs a windowing backend
# feature such as `x11`.
winit = { workspace = true, features = ["x11"] }

# `focus_test` sends real OS key and mouse events to pages in embedded views.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSEvent",
  "NSGraphicsContext",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[[example]]
name = "cef_input_test"
required-features = ["cef"]
