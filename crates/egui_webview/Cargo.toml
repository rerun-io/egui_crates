[package]
authors = ["rerun.io <opensource@rerun.io>"]
categories = ["gui"]
description = "Web pages as egui widgets"
edition.workspace = true
homepage = "https://github.com/rerun-io/egui_crates"
include = ["**/*.rs", "Cargo.toml", "README.md"]
keywords = ["webview", "egui", "gui", "browser"]
license.workspace = true
name = "egui_webview"
publish = false
readme = "README.md"
repository = "https://github.com/rerun-io/egui_crates"
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
# `cef/dox` skips the CEF download, which docs.rs can't do without network access.
features = ["cef", "cef/dox"]

[lib]


[features]
default = ["wry"]

#! `WebViewInstance::new` picks the backend. On the web it is always an `<iframe>`, and neither
#! feature has an effect there. With both `cef` and `wry` enabled, `wry` wins on macOS:
#! `WebViewInstance::new` uses the system webview, unless the `EGUI_WEBVIEW_BACKEND` environment
#! variable is `cef` at run time. `WebViewInstance::new_cef` always uses CEF.
#! On other native platforms `wry` has no effect, so CEF is used.
#! Without a backend for the platform, `WebViewInstance::new` returns `Error::Unsupported`.

## Render pages off screen with CEF (Chromium) into egui textures, on any native platform.
## The build downloads CEF (about 1 GB), and on Windows and macOS requires CMake and Ninja.
cef = ["dep:base64", "dep:cef", "dep:tempfile", "dep:winit"]

## Make Chromium's sandbox available to CEF's helper processes. On its own, it changes nothing:
## the app turns the sandbox on with `CefInitOptions::sandbox`.
cef-sandbox = ["cef", "cef/sandbox"]

## Show pages in the system webview, through [wry](https://github.com/tauri-apps/wry).
## Only macOS (`WKWebView`) has a backend so far: the feature has no effect on other platforms.
## It needs eframe's wgpu renderer.
wry = [
  "dep:base64",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-core-foundation",
  "dep:objc2-foundation",
  "dep:objc2-quartz-core",
  "dep:objc2-web-kit",
  "dep:raw-window-handle",
  "dep:wry",
]


[dependencies]
document-features = { workspace = true, optional = true }
eframe = { workspace = true, default-features = false }
egui = { workspace = true, default-features = false }
log.workspace = true
url.workspace = true

[dev-dependencies]
eframe = { workspace = true, default-features = false, features = [
  "default_fonts", # Embed the default egui fonts.
  "glow",          # The default renderer on the web.
  "wgpu",          # The renderer natively.
  "wayland",       # Required for Linux and CI.
] }

# The examples start eframe on the web with these.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "FocusOptions",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "Node",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = { workspace = true, optional = true }
cef = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# Converts egui keys to the platform scancodes that CEF expects, which egui's key events don't
# carry.
winit = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The objc2 crates must be the versions wry uses, so that the `WKWebView` wry returns has the
# same Rust type as ours.
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = [
  "std",
  "objc2-quartz-core",
  "NSAppearance",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
  "std",
  "NSDictionary",
  "NSKeyValueObserving",
  "NSString",
  "NSURL",
] }
objc2-quartz-core = { version = "0.3.2", optional = true, default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CALayer",
  "CAMetalLayer",
] }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = [
  "std",
  "WKFrameInfo",
  "WKScriptMessage",
  "WKScriptMessageHandler",
  "WKUserContentController",
] }
raw-window-handle = { version = "0.6.2", optional = true }
wry = { version = "0.57.1", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux, winit's scancode conversion (`PhysicalKeyExtScancode`) needs a windowing backend
# feature such as `x11`.
winit = { workspace = true, features = ["x11"], optional = true }

# `focus_test` sends real OS key and mouse events to pages in embedded views.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSEvent",
  "NSGraphicsContext",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[[example]]
name = "cef_input_test"
required-features = ["cef"]
