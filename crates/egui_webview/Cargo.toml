[package]
authors = ["rerun.io <opensource@rerun.io>"]
categories = ["gui"]
description = "Web pages as egui widgets"
edition.workspace = true
homepage = "https://github.com/rerun-io/egui_crates"
include = ["**/*.rs", "Cargo.toml", "README.md"]
keywords = ["webview", "egui", "gui", "browser"]
license.workspace = true
name = "egui_webview"
publish = false
readme = "README.md"
repository = "https://github.com/rerun-io/egui_crates"
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]


[features]
default = []

## Render pages off screen with CEF (Chromium) into egui textures. `WebViewInstance::new` uses it
## on platforms without a system webview, such as Linux, and when `EGUI_WEBVIEW_BACKEND=cef`.
## The build downloads CEF (about 1 GB) and requires CMake and Ninja.
cef = ["dep:cef", "dep:winit"]


[dependencies]
eframe = { workspace = true, default-features = false }
egui = { workspace = true, default-features = false }
log.workspace = true

[dev-dependencies]
eframe = { workspace = true, default-features = false, features = [
  "default_fonts", # Embed the default egui fonts.
  "glow",          # The default renderer on the web.
  "wgpu",          # The renderer natively.
  "wayland",       # Required for Linux and CI.
] }

# The examples start eframe on the web with these.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "FocusOptions",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "Node",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cef = { version = "156.3.0", default-features = false, optional = true }
raw-window-handle = "0.6.2"
# Converts egui keys to the platform scancodes that CEF expects, which egui's key events don't
# carry. Keep it at egui-winit's version, so the dependency tree has a single winit.
winit = { version = "0.30.13", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The objc2 crates must be the versions wry uses, so that the `WKWebView` wry returns has the
# same Rust type as ours.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-quartz-core",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSString",
  "NSURL",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CALayer",
  "CAMetalLayer",
] }
wry = { version = "0.57.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
egui-wgpu = { version = "0.37.0", default-features = false }
# Must be the version wry uses, so that the `WebView2` controller wry returns has the same Rust
# type as ours.
webview2-com = "0.39.1"
wgpu = { version = "30.0.0", default-features = false, features = ["dx12"] }
windows = { version = "0.62.2", features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
] }
wry = { version = "0.57.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux, winit's scancode conversion (`PhysicalKeyExtScancode`) needs a windowing backend
# feature such as `x11`.
winit = { version = "0.30.13", default-features = false, features = ["x11"], optional = true }

# `focus_test` sends real OS key and mouse events to pages in embedded views.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSEvent",
  "NSGraphicsContext",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62.2", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "cef_input_test"
required-features = ["cef"]
