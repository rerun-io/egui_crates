[package]
authors = ["rerun.io <opensource@rerun.io>"]
categories = ["gui"]
description = "Web pages as egui widgets"
edition.workspace = true
homepage = "https://github.com/rerun-io/egui_crates"
include = ["**/*.rs", "Cargo.toml", "README.md"]
keywords = ["webview", "egui", "gui", "browser"]
license.workspace = true
name = "egui_webview"
publish = false
readme = "README.md"
repository = "https://github.com/rerun-io/egui_crates"
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]


[features]
default = []

## Render pages off screen with CEF (Chromium) into egui textures. `WebViewInstance::new` uses it
## on platforms without a system webview, such as Linux, and when `EGUI_WEBVIEW_BACKEND=cef`.
## The build downloads CEF (about 1 GB) and requires CMake and Ninja.
cef = ["dep:cef", "dep:winit"]


[dependencies]
eframe = { workspace = true, default-features = false }
egui = { workspace = true, default-features = false }
log.workspace = true

[dev-dependencies]
eframe = { workspace = true, default-features = false, features = [
  "default_fonts", # Embed the default egui fonts.
  "glow",          # The default renderer on the web.
  "wgpu",          # The renderer natively.
  "wayland",       # Required for Linux and CI.
] }

# The examples start eframe on the web with these.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "FocusOptions",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "Node",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cef = { version = "156.3.0", default-features = false, optional = true }
# Converts egui keys to the platform scancodes that CEF expects, which egui's key events don't
# carry. Keep it at egui-winit's version, so the dependency tree has a single winit.
winit = { version = "0.30.13", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux, winit's scancode conversion (`PhysicalKeyExtScancode`) needs a windowing backend
# feature such as `x11`.
winit = { version = "0.30.13", default-features = false, features = ["x11"], optional = true }

[[example]]
name = "cef_input_test"
required-features = ["cef"]
