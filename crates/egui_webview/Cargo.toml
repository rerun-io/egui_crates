[package]
authors = ["rerun.io <opensource@rerun.io>"]
categories = ["gui"]
description = "Web pages as egui widgets"
edition.workspace = true
homepage = "https://github.com/rerun-io/egui_crates"
include = ["**/*.rs", "Cargo.toml", "README.md"]
keywords = ["webview", "egui", "gui", "browser"]
license.workspace = true
name = "egui_webview"
publish = false
readme = "README.md"
repository = "https://github.com/rerun-io/egui_crates"
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]


[dependencies]
eframe = { workspace = true, default-features = false }
egui = { workspace = true, default-features = false }
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "FocusOptions",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MessageEvent",
  "Node",
  "Window",
] }

