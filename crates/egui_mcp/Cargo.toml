[package]
name = "egui_mcp"
version = "0.3.0"
authors = ["Lucas Meurer <hi@lucasmerlin.me>"]
description = "MCP server that drives live egui apps over the egui_inspection protocol"
edition.workspace = true
rust-version.workspace = true
homepage = "https://github.com/rerun-io/egui_crates"
license.workspace = true
readme = "README.md"
repository = "https://github.com/rerun-io/egui_crates"
categories = ["gui", "development-tools::testing"]
keywords = ["egui", "mcp", "accesskit", "inspector", "testing"]
include = ["**/*.rs", "Cargo.toml"]
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[[bin]]
name = "egui-mcp"
path = "src/main.rs"

[dependencies]
egui.workspace = true
egui_inspection.workspace = true
egui_inspection_tools.workspace = true
base64.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
