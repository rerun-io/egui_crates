[package]
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
edition.workspace = true
include = ["../../LICENSE-APACHE", "../../LICENSE-MIT", "**/*.rs", "Cargo.toml"]
license.workspace = true
name = "demo"
publish = false
rust-version.workspace = true
version.workspace = true
default-run = "demo"

[lints]
workspace = true

[dependencies]
egui_table.workspace = true

egui.workspace = true
eframe = { workspace = true, default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "system_fonts",  # Load system fonts for glyphs the default fonts lack, e.g. emoji (native only).
    "wayland",       # Required for Linux and CI.
] }
log.workspace = true
serde = { workspace = true, features = ["derive"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
web-sys.workspace = true              # to access the DOM (to hide the loading text)

[dev-dependencies]
# Bundle emoji fonts, because tests have no system fonts to fall back on:
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
