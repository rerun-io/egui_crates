# Copied from https://github.com/rerun-io/rerun_template
on:
  push:
    branches:
      - "main"
  pull_request:
    types: [ opened, synchronize ]
  merge_group:

name: Rust

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust-check:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rust-docs, clippy, rustfmt
          toolchain: 1.95.0
          override: true

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          # some deps used by eframe, for checking the example
          packages: libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev # libgtk-3-dev is used by rfd
          version: 1.0
          execute_install_scripts: true

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: check --all-features
        run: cargo check --workspace --all-features --all-targets

      - name: check default features
        run: cargo check --workspace --all-targets

      - name: check --no-default-features
        run: cargo check --workspace --no-default-features --all-targets

      - name: Test doc-tests
        run: cargo test --workspace --doc --all-features

      - name: cargo doc --lib
        run: cargo doc --workspace --lib --no-deps --all-features

      - name: cargo doc --document-private-items
        run: cargo doc --workspace --document-private-items --no-deps --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------

  tests:
    name: Tests (macOS)
    # The snapshot tests render with wgpu, so they need a real GPU. macOS runners have one.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the reference snapshots are in git-LFS

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          override: true

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --workspace --all-features --no-run

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Upload test snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-snapshots
          path: "**/tests/snapshots/**"

  # ---------------------------------------------------------------------------

  check_wasm:
    name: Check wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          override: true
          target: wasm32-unknown-unknown
          components: clippy,rustfmt

      # `kittest_inspector` and `egui_mcp` are native-only tools: they use tokio's net
      # stack, the system clipboard and a git branch of egui.
      - name: Check wasm32
        run: cargo check --workspace --exclude kittest_inspector --exclude egui_mcp --target wasm32-unknown-unknown --lib

      - name: Clippy wasm32
        env:
          CLIPPY_CONF_DIR: "scripts/clippy_wasm" # Use scripts/clippy_wasm/clippy.toml
        run: cargo clippy --workspace --exclude kittest_inspector --exclude egui_mcp --target wasm32-unknown-unknown --lib -- -D warnings

  # ---------------------------------------------------------------------------

  cargo-deny:
    name: Check Rust dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        rust-version: "1.95.0"
        log-level: warn
        command: check
